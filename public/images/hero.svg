<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 354" width="354" height="354">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#6FB7DE" />
			<stop offset="100%" stop-color="#1560BD" />
		</linearGradient>
	</defs>
	<rect width="354" height="354" fill="url(#sky)" />

	<!-- building -->
	<rect x="40" y="90" width="180" height="230" fill="#0B3D75" opacity="0.85" />
	<!-- window grid -->
	<g fill="#EAF6FB" opacity="0.9">
		<rect x="56" y="106" width="36" height="36" />
		<rect x="104" y="106" width="36" height="36" />
		<rect x="152" y="106" width="36" height="36" />
		<rect x="56" y="154" width="36" height="36" />
		<rect x="104" y="154" width="36" height="36" />
		<rect x="152" y="154" width="36" height="36" />
		<rect x="56" y="202" width="36" height="36" />
		<rect x="104" y="202" width="36" height="36" />
		<rect x="152" y="202" width="36" height="36" />
		<rect x="56" y="250" width="36" height="36" />
		<rect x="104" y="250" width="36" height="36" />
		<rect x="152" y="250" width="36" height="36" />
	</g>

	<!-- squeegee arm cleaning a window -->
	<g transform="translate(150,120) rotate(15)">
		<rect x="-4" y="-70" width="8" height="80" rx="4" fill="#F2F2F2" />
		<rect x="-30" y="6" width="60" height="14" rx="7" fill="#2FD3C6" />
	</g>

	<!-- sparkle accents -->
	<g fill="#ffffff" opacity="0.9">
		<path d="M250 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" />
		<path d="M280 140 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" />
		<path d="M300 200 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" />
	</g>

	<!-- water droplets -->
	<g fill="#EAF6FB" opacity="0.8">
		<circle cx="90" cy="300" r="5" />
		<circle cx="120" cy="312" r="4" />
		<circle cx="150" cy="298" r="6" />
	</g>
</svg>
